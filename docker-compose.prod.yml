name: ${COMPOSE_PROJECT_NAME:-vacuum-traceability-prod}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacuum_traceability}
      POSTGRES_USER: ${POSTGRES_USER:-vacuum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-CHANGE_ME_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal

  migrate:
    build:
      context: ./backend
      target: migration
    image: ${BACKEND_MIGRATION_IMAGE:-vacuum-traceability-backend-migration}:${IMAGE_TAG:-local}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://vacuum_user:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/vacuum_traceability?schema=public}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: production
    image: ${BACKEND_IMAGE:-vacuum-traceability-backend}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      APP_NAME: ${APP_NAME:-vacuum-traceability-api}
      DATABASE_URL: ${DATABASE_URL:-postgresql://vacuum_user:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/vacuum_traceability?schema=public}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-vacuum-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-CHANGE_ME_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-CHANGE_ME_S3_SECRET_KEY}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- \"http://127.0.0.1:$${PORT:-3000}/health\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  admin:
    build:
      context: ./admin
    image: ${ADMIN_IMAGE:-vacuum-traceability-admin}:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  minio_data:
