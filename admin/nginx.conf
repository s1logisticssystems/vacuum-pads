resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;

  # The upstream host is resolved through a variable (not a static proxy_pass
  # target) so nginx re-resolves "backend" per request via Docker's embedded
  # DNS (resolver above) instead of once at config load. A static proxy_pass
  # would make nginx exit permanently ("host not found in upstream") if the
  # backend container's network endpoint isn't registered yet when nginx
  # starts, e.g. after a host reboot where all containers start at once.
  #
  # Variable-based proxy_pass does not do the automatic location-prefix ->
  # proxy_pass-URI rewrite that a static proxy_pass does, so the /api prefix
  # is stripped explicitly with `rewrite ... break` before proxying.
  location /api/events/ {
    set $backend_upstream backend:3000;
    rewrite ^/api/events/(.*)$ /events/$1 break;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    set $backend_upstream backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
